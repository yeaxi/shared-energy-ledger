# Home Assistant integration quality-scale attestations for Shared Energy Ledger.
#
# Each rule maps to either "done" (implemented and covered by tests) or
# "exempt" (with a rationale). "todo" is not used at v0.1: unmet rules keep
# the manifest at ``quality_scale: silver`` until they are addressed.
#
# References for reviewers:
# - REQUIREMENTS.md (the public specification and invariants I1..I10)
# - .cursor/skills/ha-platinum-quality/SKILL.md (checklist)
# - .cursor/skills/energy-accounting-invariants/SKILL.md (fail-closed rules)

rules:
  # ---------- Bronze ----------
  action-setup: done                         # custom_components/shared_energy_ledger/__init__.py::async_setup_entry
  appropriate-polling: done                  # DataUpdateCoordinator with UPDATE_INTERVAL, no per-entity polling
  brands: todo                               # Brand PR to home-assistant/brands pending
  common-modules: done                       # models.py, const.py, coordinator.py
  config-flow: done                          # config_flow.py (multi-step user + async_step_reconfigure)
  config-flow-test-coverage: done            # tests/integration/test_config_flow*.py + test_options_flow_menu.py
  dependency-transparency: done              # manifest.json requirements pinned to PyPI
  docs-actions: done                         # docs/quickstart.md, docs/configuration.md
  docs-high-level-description: done          # docs/index.md
  docs-installation-instructions: done       # docs/quickstart.md
  docs-removal-instructions: done            # docs/upgrade-guide.md
  entity-event-setup: done                   # CoordinatorEntity + entry.async_on_unload
  entity-unique-id: done                     # entity.py builds unique_id from entry_id + resource_slug + description.key
  has-entity-name: done                      # SharedEnergyLedgerEntity._attr_has_entity_name = True
  runtime-data: done                         # __init__.py sets entry.runtime_data
  test-before-configure: done                # config_flow validates currency, slug, tariff schedule at each step
  test-before-setup: done                    # coordinator._load_config_if_ready refuses to boot on bad schedule (issue_registry)
  unique-config-entry: done                  # _async_current_entries + single_instance_allowed abort

  # ---------- Silver ----------
  action-exceptions: done                    # services.py raises HomeAssistantError with contextual messages
  config-entry-unloading: done               # async_unload_entry unloads platforms and services
  docs-configuration-parameters: done        # docs/configuration.md
  docs-installation-parameters: done         # docs/quickstart.md
  entity-unavailable: done                   # sensor.py + binary_sensor.py override .available; requirement I1
  integration-owner: exempt
  # ^ codeowners is empty at v0.1; ownership is documented in AGENTS.md and
  # community-triage identity in docs/cursor-agents.md.
  log-when-unavailable: done                 # coordinator.py raises repairs, not log spam (issues.py)
  parallel-updates: done                     # coordinator drives updates; entities do not fetch
  reauthentication-flow: exempt
  # ^ Shared Energy Ledger has no external credentials. All inputs are internal HA
  # entity selectors; async_step_reconfigure covers the rename case.
  test-coverage: done                        # pytest --cov-fail-under=90 (176 tests, 91% coverage)

  # ---------- Gold ----------
  devices: done                              # entity.py registers DeviceInfo(identifiers={(DOMAIN, entry.entry_id)})
  diagnostics: done                          # diagnostics.py returns redacted config + coordinator payload
  discovery: exempt
  # ^ Shared Energy Ledger is a configuration-only hub; there is nothing on the
  # network to discover. All sources are user-supplied entity IDs.
  discovery-update-info: exempt              # see discovery
  docs-data-update: done                     # docs/configuration.md documents update cadence
  docs-examples: done                        # docs/allocation-policies.md, docs/tariffs-and-currency.md
  docs-known-limitations: done               # docs/upgrade-guide.md and docs/troubleshooting.md
  docs-supported-devices: exempt             # no third-party devices; the integration accepts any HA sensor with the right unit
  docs-supported-functions: done             # docs/index.md + docs/configuration.md
  docs-troubleshooting: done                 # docs/troubleshooting.md
  docs-use-cases: done                       # docs/allocation-policies.md, docs/battery-ledger.md
  dynamic-devices: exempt                    # no runtime device discovery
  entity-category: done                      # tariff select is diagnostic; grid-import-cost-per-kwh has state_class measurement
  entity-device-class: done                  # sensor.py declares device_class per description
  entity-disabled-by-default: exempt         # every entity is user-visible; there are no low-value diagnostics that need hiding
  entity-translations: done                  # every entity uses translation_key from strings.json
  exception-translations: done               # HomeAssistantError messages backed by strings.json.services / options.error
  icon-translations: done                    # icons declared per NumberEntityDescription / SelectEntity
  reconfiguration-flow: done                 # config_flow.async_step_reconfigure
  repair-issues: done                        # issues.py + strings.json.issues
  stale-devices: exempt                      # devices are one-per-entry; no auto-expire path

  # ---------- Platinum ----------
  async-dependency: done                     # all dependencies (recorder, aiohttp, util.dt) are async-first
  inject-websession: exempt                  # no HTTP client is used
  strict-typing: done                        # mypy --strict passes on custom_components/shared_energy_ledger

quality_scale: silver
# ^ Bump to "gold" or "platinum" only after the todo rules above resolve
# and the manifest is updated in the same PR.
