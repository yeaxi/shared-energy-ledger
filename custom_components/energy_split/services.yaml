rebuild_period_report:
  name: Rebuild period report
  description: >-
    Rebuild a deterministic Recorder-based JSON report for the given period.
    The report is finalized-as-of, revision-hashed, and safe to consume from
    dashboards.
  fields:
    start:
      name: Start (local)
      description: Local start of the reporting period.
      required: true
      selector:
        datetime:
    end:
      name: End (local)
      description: Local end of the reporting period.
      required: true
      selector:
        datetime:
    tenant:
      name: Tenant (optional)
      description: Restrict the report to a single tenant slug.
      required: false
      selector:
        text:

reset_battery_ledger:
  name: Reset battery ledger
  description: >-
    Reset the priced battery stock to the given values. Requires admin. Fails
    when the battery data-fresh gate is off or when the boundary pair
    (stock_kwh, stock_cost) is incoherent.
  fields:
    stock_kwh:
      name: Stock (kWh)
      description: New priced stock in kWh (>= 0).
      required: true
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
          unit_of_measurement: kWh
    stock_cost:
      name: Stock cost
      description: Cost of the new priced stock in the configured currency.
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box

set_tariff_rate:
  name: Set tariff rate
  description: >-
    Set the per-kWh rate for a named tariff slot from a given effective_from
    timestamp forward. The change is journaled as a new accounting epoch;
    historical intervals keep their original rate.
  fields:
    slot:
      name: Slot
      description: Name of the tariff slot (for example day or night).
      required: true
      selector:
        text:
    rate:
      name: Rate
      description: Per-kWh rate in the configured currency (>= 0).
      required: true
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    effective_from:
      name: Effective from
      description: Timestamp from which the new rate applies.
      required: true
      selector:
        datetime:
