[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-split"
version = "0.1.0"
description = "Home Assistant custom integration for cooperative energy accounting"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Energy Split contributors" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "dashboard", "docs"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
  "PLE",
  "SIM",
  "RUF",
  "N",
]
ignore = [
  "E501",
  "SIM103",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "PLE1205"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["custom_components/energy_split"]
exclude = ["legacy", "dashboard", "docs", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:homeassistant.*",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["custom_components/energy_split"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
