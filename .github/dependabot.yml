version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-tooling:
        patterns:
          - "*"
    # typescript-eslint still requires typescript <6.1.0 (no TS 7
    # programmatic API until 7.1). Drop this ignore when that peer
    # range admits a 7.x compiler.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
