name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install ruff mypy homeassistant voluptuous
      - name: Ruff
        run: python -m ruff check .
      - name: mypy (strict)
        run: python -m mypy custom_components/energy_split
      - name: JSON validation
        run: |
          python - <<'PY'
          import json
          import pathlib
          skipped = {'legacy', 'node_modules', '.venv', '.git'}
          for path in pathlib.Path('.').rglob('*.json'):
              if any(part in skipped for part in path.parts):
                  continue
              json.loads(path.read_text())
          print('JSON validation: ok')
          PY
      - name: No silent zero
        run: python scripts/lint_no_silent_zero.py
      - name: Translations
        run: python scripts/check_translations.py custom_components/energy_split
      - name: Private denylist
        run: python scripts/check_private_denylist.py
      - name: Requirements traceability
        run: python scripts/check_requirements_traceability.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        # The pytest-homeassistant-custom-component release cadence is tied
        # to a specific Home Assistant version. Installing pinned older HA
        # versions requires the matching plugin release, so we run against
        # ``latest`` here and let the plugin resolve HA. The matrix will be
        # reintroduced together with ``scripts/matrix_versions.py`` which
        # maps HA versions to plugin versions.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install --upgrade homeassistant pytest-homeassistant-custom-component
      - name: Run pytest
        run: >-
          python -m pytest tests/ -q -W error
          --cov=custom_components.energy_split
          --cov-report=term-missing
          --cov-fail-under=90

  frontend:
    name: Frontend (Lovelace cards)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
