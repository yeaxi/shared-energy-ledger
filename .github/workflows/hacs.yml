name: HACS validation

on:
  push:
    branches: [main]
  schedule:
    # Off-hours cron avoids the 00:00 UTC HACS-ecosystem rate-limit storm
    # on raw.githubusercontent.com, which surfaces as
    # ``<Validation integration_manifest> failed: expected a dictionary.
    # Got None`` in the action logs.
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          github_token: ${{ secrets.GITHUB_TOKEN }}
