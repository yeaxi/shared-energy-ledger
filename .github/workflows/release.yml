name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Full verification gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  docs:
    name: Documentation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_docs.txt
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_docs.txt
      - name: Build site
        run: python -m mkdocs build --strict

  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verification, docs]
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate tag and prepare release notes
        id: release
        run: >-
          python scripts/prepare_release.py
          "${GITHUB_REF_NAME}"
          --notes release-notes.md
          --github-output "${GITHUB_OUTPUT}"
      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: metadata
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-metadata
          path: release-metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dashboard-bundles
          path: release-assets
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-metadata/release-notes.md
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: true
