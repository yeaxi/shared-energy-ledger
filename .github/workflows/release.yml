name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm manifest.json version matches the tag
        run: |
          python - <<'PY'
          import json
          import os
          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.lstrip("v")
          data = json.loads(open("custom_components/energy_split/manifest.json").read())
          if data["version"] != expected:
              raise SystemExit(
                  f"manifest.json version {data['version']!r} does not match tag {tag!r}"
              )
          print(f"manifest.json version matches tag {tag!r}")
          PY
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration

  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
